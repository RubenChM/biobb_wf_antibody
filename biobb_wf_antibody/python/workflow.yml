global_properties:
  working_dir_path: data
  can_write_console_log: False
  # Structures to dock. Every identifier is a PDB code followed by the chains of
  # interest, the ones after the colon being the antigen chains of the reference
  # complex, and a trailing '(<n>)' the model to extract from the entry. The PDB
  # codes of the step0_* sections and the chains and models of the step1_* ones are
  # derived from these three identifiers, so they are not repeated here.
  # To dock one of the complexes of the benchmark, do not edit them by hand: run
  # array/launch_wf.py with the index of the complex and it writes a copy of this
  # file with the three identifiers and a working directory of its own.
  reference: 4G6M_HL:A
  antibody: 4G6K_HL
  antigen: 4I1B_A
  # Antibody-antigen complexes of the Protein-Protein Interaction Benchmark 5
  # Just for reference, the workflow does not use them
  complexes:
    #  Reference          Antibody     A
    - [2VXT_HL:I,        2VXU_HL,     1J0S_A]
    - [2W9E_HL:A,        2W9D_HL,     1QM1_A]
    - [3EOA_LH:I,        3EO9_LH,     3F74_A]
    - [3HMX_LH:AB,       3HMW_LH,     1F45_AB]
    - [3MXW_LH:A,        3MXV_LH,     3M1N_A]
    - [5VPG_CD:A,        3RVT_CD,     3F5V_A]
    - [4DN4_LH:M,        4DN3_LH,     1DOL_A]
    - [4FQI_HL:ABEFCD,   4FQH_HL,     2FK0_ABCDEF]
    - [4G6J_HL:A,        4G5Z_HL,     4I1B_A]
    - [4G6M_HL:A,        4G6K_HL,     4I1B_A]
    - [4GXU_MN:ABEFCD,   4GXV_HL,     1RUZ_HIJKLM]
    # Medium difficult
    - [3EO1_AB:CF,       3EO0_AB,     1TGJ_AB]
    - [3G6D_LH:A,        3G6A_LH,     '1IK0_A(10)']
    - [3HI6_XY:B,        3HI5_HL,     1MJN_A]
    - [3L5W_LH:I,        3L7E_LH,     '1IK0_A(11)']
    - [3V6Z_AB:F,        3V6F_AB,     3KXS_F]

# Single configuration file for the whole workflow. Every step is named
# 'step<subworkflow index>_<step index>_<step name>', so the sections of each
# subworkflow are grouped together:
#   step0_* -> workflow.py    (input structures)
#   step1_* -> 1_haddock.py   (antibody-antigen docking)
#   step2_* -> 2_MD.py        (MD of the CDR clusters)
#   step3_* -> 3_AWH.py       (AWH free energy calculation)

# ============================================================================
# Length of the GROMACS simulations, shared by the MD (2_MD.py) and the AWH
# (3_AWH.py) subworkflows: 'prep_mdp' is used by the minimization and the
# equilibration steps, 'prod_mdp' by the production runs. They are defined once
# here instead of being repeated in every grompp step.
# ============================================================================

prep_mdp:
  properties:
    mdp:
      nsteps: 5000
      nstxout: 1000

prod_mdp:
  properties:
    mdp:
      nsteps: 5000
      nstxout: 1000

# ============================================================================
# Subworkflow 0 (workflow.py): download the input structures
#
# The 'pdb_code' of each structure is not set here, it is derived from the
# 'reference', 'antibody' and 'antigen' global properties by workflow.py.
# ============================================================================

step0_0_pdb_reference:
  tool: pdb
  paths:
    output_pdb_path: reference.pdb

step0_1_pdb_antibody:
  tool: pdb
  paths:
    output_pdb_path: antibody.pdb

step0_2_pdb_antigen:
  tool: pdb
  paths:
    output_pdb_path: antigen.pdb

# ============================================================================
# Subworkflow 1 (1_haddock.py): antibody-antigen docking with HADDOCK3
#
# The chains to keep from each downloaded entry are derived from the three
# identifiers by 1_haddock.py: the antibody ones are cleaned separately and
# merged into a single chain A, the antigen ones are relabelled as chain B.
# ============================================================================

step1_0_prepare_antibody:
  paths:
    input_pdb_path: dependency/step0_1_pdb_antibody/output_pdb_path
    output_pdb_path: antibody_clean.pdb

step1_1_biobb_pdb_merge_antibody:
  tool: biobb_pdb_merge
  paths:
    input_file_path: chains.zip
    output_file_path: antibody_merged.pdb

step1_2_prepare_antigen:
  paths:
    input_pdb_path: dependency/step0_2_pdb_antigen/output_pdb_path
    output_pdb_path: antigen_clean.pdb

step1_3_prepare_reference_antibody:
  paths:
    input_pdb_path: dependency/step0_0_pdb_reference/output_pdb_path
    output_pdb_path: reference_antibody.pdb

step1_4_biobb_pdb_merge_reference_antibody:
  tool: biobb_pdb_merge
  paths:
    input_file_path: chains.zip
    output_file_path: reference_antibody_merged.pdb

step1_5_prepare_reference_antigen:
  paths:
    input_pdb_path: dependency/step0_0_pdb_reference/output_pdb_path
    output_pdb_path: reference_antigen.pdb

step1_6_merge_reference_complex:
  paths:
    output_pdb_path: reference_clean.pdb

step1_7_haddock_interface:
  tool: haddock_interface
  paths:
    input_pdb_path: dependency/step1_6_merge_reference_complex/output_pdb_path
    output_txt_path: reference_interface.txt
  properties:
    cutoff: 3.9

step1_8_antibody_actpass:
  paths:
    output_actpass_path: antibody_actpass.txt

step1_9_haddock3_passive_from_active:
  tool: haddock3_passive_from_active
  paths:
    input_pdb_path: dependency/step1_2_prepare_antigen/output_pdb_path
    output_actpass_path: antigen_actpass.txt

step1_10_haddock3_actpass_to_ambig:
  tool: haddock3_actpass_to_ambig
  paths:
    input_actpass1_path: dependency/step1_8_antibody_actpass/output_actpass_path
    input_actpass2_path: dependency/step1_9_haddock3_passive_from_active/output_actpass_path
    output_tbl_path: ambig-paratope-epitope.tbl
  properties:
    segid_one: A
    segid_two: B

step1_11_haddock3_restrain_bodies:
  tool: haddock3_restrain_bodies
  paths:
    input_structure_path: dependency/step1_0_prepare_antibody/output_pdb_path
    output_tbl_path: antibody-unambig.tbl

step1_12_haddock3_run:
  tool: haddock3_run
  paths:
    haddock_config_path: 'file:haddock_config.cfg'
    input_haddock_wf_data: haddock_input
    output_haddock_wf_data: haddock_output
  properties:
    disable_sandbox: True  # Do not copy the input data into the sandbox
    # Override the sampling of haddock_config.cfg to make the docking run faster,
    # as the notebook does. Comment it out to run the full protocol.
    cfg:
      rigidbody.1:
        sampling: 200
      seletop.1:
        select: 40

# ============================================================================
# Subworkflow 2 (2_MD.py): MD of the CDR clusters -> step2_*
# ============================================================================

# ============================================================================
# Subworkflow 3 (3_AWH.py): AWH free energy calculation -> step3_*
# ============================================================================
