# ====================================================================
# Antibody-antigen docking driven by CDR to epitope ambiguous restraints
#
# https://www.bonvinlab.org/haddock3-user-manual/docking_scenarios/antibody-antigen.html
# https://github.com/haddocking/haddock3/blob/main/examples/docking-antibody-antigen/docking-antibody-antigen-CDR-NMR-CSP-full.cfg
#
# Shared by the three docking runs of the workflow, the baseline one of 1_haddock.py
# and the CDR-loop ensemble ones of 2_MD.py and 3_AWH.py, so they are comparable.
# Every file name below is relative to the input folder each of them stages
# (step<n>_*_haddock3_run/haddock_input).
# ====================================================================

# directory in which the docking will be done
run_dir = "run"

# execution mode
mode = "local"
ncores = 12
debug = true

# molecules to be docked
molecules = [
    "antibody.pdb",
    "antigen.pdb"
    ]

# ====================================================================
# Parameters for each stage are defined below, the order of the sections is
# the order in which HADDOCK3 runs them
# ====================================================================
[topoaa]

[rigidbody]
sampling = 1000
tolerance = 5
# CDR to epitope ambig restraints
ambig_fname = "ambig.tbl"
# Restraints to keep the antibody chains together
unambig_fname = "unambig.tbl"

[caprieval]
reference_fname = "reference.pdb"

[seletop]
select = 200

[caprieval]
reference_fname = "reference.pdb"

[flexref]
tolerance = 5
# CDR to epitope ambig restraints
ambig_fname = "ambig.tbl"
# Restraints to keep the antibody chains together
unambig_fname = "unambig.tbl"

[caprieval]
reference_fname = "reference.pdb"

[emref]
tolerance = 5
# CDR to epitope ambig restraints
ambig_fname = "ambig.tbl"
# Restraints to keep the antibody chains together
unambig_fname = "unambig.tbl"

[caprieval]
reference_fname = "reference.pdb"

[clustfcc]

[seletopclusts]
top_models = 4

[caprieval]
reference_fname = "reference.pdb"

# ====================================================================
